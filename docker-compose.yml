name: room-service-hadith

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-room_service}
      POSTGRES_USER: ${POSTGRES_USER:-room_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-room_service_dev_only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 stores its cluster under a versioned subdirectory.
      # Mount the parent path so upgrades and pg_upgrade keep the expected layout.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-07-23T15-54-02Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3}
    profiles:
      - monitoring
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7}
    profiles:
      - monitoring
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - '${LOKI_PORT:-3100}:3100'
    volumes:
      - ./infrastructure/monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.4-ubuntu}
    profiles:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev_only}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  loki-data:
  grafana-data:
