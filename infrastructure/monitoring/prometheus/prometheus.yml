global:
  evaluation_interval: 15s
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # The API target becomes active once the API service is added to Compose.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:3000
