name: EGI TV Release

on:
  push:
    tags:
      - 'tv-v*-code*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name, for example 0.4.8'
        required: true
        type: string
      version_code:
        description: 'Monotonically increasing Android version code'
        required: true
        type: string
      previous_version_code:
        description: 'Highest version code currently installed in production'
        required: true
        type: string
      bootstrap_only:
        description: 'Build a signed bootstrap APK without publishing an update feed'
        required: false
        default: false
        type: boolean
      reuse_artifact_run_id:
        description: 'Recovery only: reuse the signed artifact from an earlier workflow run instead of rebuilding'
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  # A single production feed exists. Two simultaneous promotions could make
  # the API point at a manifest whose object has not finished publishing yet.
  group: egi-tv-production-release
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source
        run: pnpm validate

  build-release:
    name: Build and verify signed release
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tv-release
    outputs:
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      version_name: ${{ steps.resolve.outputs.version_name }}
      update_apk_url: ${{ steps.resolve.outputs.update_apk_url }}
      release_id: ${{ steps.resolve.outputs.update_release_id }}
      autopublish: ${{ steps.resolve.outputs.autopublish }}
      object_prefix: ${{ steps.resolve.outputs.object_prefix }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}

    env:
      RELEASE_EVENT: ${{ github.event_name }}
      RELEASE_TAG: ${{ github.ref_name }}
      INPUT_VERSION_NAME: ${{ inputs.version_name }}
      INPUT_VERSION_CODE: ${{ inputs.version_code }}
      INPUT_PREVIOUS_VERSION_CODE: ${{ inputs.previous_version_code }}
      INPUT_BOOTSTRAP_ONLY: ${{ inputs.bootstrap_only }}
      INPUT_REUSE_ARTIFACT_RUN_ID: ${{ inputs.reuse_artifact_run_id }}
      TV_INITIAL_PRODUCTION_VERSION_CODE: ${{ vars.TV_INITIAL_PRODUCTION_VERSION_CODE || '11' }}
      TV_PRODUCTION_API_BASE_URL: ${{ vars.TV_PRODUCTION_API_BASE_URL || 'https://api-production-505c.up.railway.app/api/v1/' }}
      TV_UPDATE_PUBLIC_BASE_URL: ${{ vars.TV_UPDATE_PUBLIC_BASE_URL || '' }}
      TV_UPDATE_S3_PREFIX: ${{ vars.TV_UPDATE_S3_PREFIX || 'egi-tv' }}
      TV_UPDATE_AUTOPUBLISH_ENABLED: ${{ vars.TV_UPDATE_AUTOPUBLISH_ENABLED || 'false' }}

    steps:
      - name: Checkout release source and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 17
        if: ${{ inputs.reuse_artifact_run_id == '' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: ${{ inputs.reuse_artifact_run_id == '' }}
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        if: ${{ inputs.reuse_artifact_run_id == '' }}
        # API 37 is currently a preview package and is not on sdkmanager's
        # stable channel yet.
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run native TV test-only gate
        if: ${{ inputs.reuse_artifact_run_id == '' }}
        shell: bash
        working-directory: apps/tv-shell
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug \
            -PtvTarget=emulator \
            -PtvApiBaseUrl=http://10.0.2.2:3000/api/v1/ \
            --no-daemon

      - name: Resolve and validate release identity
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_PREVIOUS_VERSION_CODE: ${{ inputs.previous_version_code }}
          INPUT_BOOTSTRAP_ONLY: ${{ inputs.bootstrap_only }}
          INITIAL_PRODUCTION_VERSION_CODE: ${{ vars.TV_INITIAL_PRODUCTION_VERSION_CODE || '11' }}
          API_BASE_URL: ${{ vars.TV_PRODUCTION_API_BASE_URL || 'https://api-production-505c.up.railway.app/api/v1/' }}
          UPDATE_PUBLIC_BASE_URL: ${{ vars.TV_UPDATE_PUBLIC_BASE_URL || '' }}
          UPDATE_S3_PREFIX: ${{ vars.TV_UPDATE_S3_PREFIX || 'egi-tv' }}
          AUTOPUBLISH_ENABLED: ${{ vars.TV_UPDATE_AUTOPUBLISH_ENABLED || 'false' }}
          REF_PROTECTED: ${{ github.ref_protected }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags --prune origin main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo 'The release commit must be reachable from origin/main.' >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version_name="${INPUT_VERSION_NAME:-}"
            version_code="${INPUT_VERSION_CODE:-}"
            previous_version_code="${INPUT_PREVIOUS_VERSION_CODE:-}"
            bootstrap_only="${INPUT_BOOTSTRAP_ONLY:-false}"
          else
            if [[ ! "$RELEASE_TAG" =~ ^tv-v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)*)-code([0-9]+)$ ]]; then
              echo "Release tag must use tv-v<semver>-code<number>, for example tv-v0.4.8-code12." >&2
              exit 1
            fi
            version_name="${BASH_REMATCH[1]}"
            version_code="${BASH_REMATCH[3]}"
            previous_version_code="${INITIAL_PRODUCTION_VERSION_CODE:-}"
            bootstrap_only=false

            if [[ "${REF_PROTECTED:-false}" != 'true' ]]; then
              echo 'Production tag releases must run from a protected Git ref.' >&2
              exit 1
            fi

            if [[ ! "$previous_version_code" =~ ^[0-9]+$ ]]; then
              echo 'TV_INITIAL_PRODUCTION_VERSION_CODE must be a positive integer.' >&2
              exit 1
            fi

            while IFS= read -r existing_tag; do
              if [[ "$existing_tag" =~ ^tv-v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)*)-code([0-9]+)$ ]]; then
                candidate_code="${BASH_REMATCH[3]}"
                if (( candidate_code > previous_version_code && candidate_code < version_code )); then
                  previous_version_code="$candidate_code"
                fi
              fi
            done < <(git tag --list 'tv-v*-code*')
          fi

          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)*$ ]]; then
            echo 'version_name must be a safe semantic version such as 0.4.8 or 0.4.8-rc.1.' >&2
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo 'version_code must be a positive integer.' >&2
            exit 1
          fi
          if [[ ! "$previous_version_code" =~ ^[0-9]+$ ]]; then
            echo 'previous_version_code must be a non-negative integer.' >&2
            exit 1
          fi
          if [[ ! "$INITIAL_PRODUCTION_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo 'TV_INITIAL_PRODUCTION_VERSION_CODE must be a non-negative integer.' >&2
            exit 1
          fi
          if (( version_code <= previous_version_code )); then
            echo "version_code $version_code must be greater than previous_version_code $previous_version_code." >&2
            exit 1
          fi
          if (( version_code <= INITIAL_PRODUCTION_VERSION_CODE )); then
            echo "version_code $version_code must be greater than the installed production baseline $INITIAL_PRODUCTION_VERSION_CODE." >&2
            exit 1
          fi
          if [[ -z "${API_BASE_URL:-}" ]]; then
            echo 'TV_PRODUCTION_API_BASE_URL is required.' >&2
            exit 1
          fi
          if [[ "$AUTOPUBLISH_ENABLED" != 'true' && "$AUTOPUBLISH_ENABLED" != 'false' ]]; then
            echo 'TV_UPDATE_AUTOPUBLISH_ENABLED must be true or false.' >&2
            exit 1
          fi

          prefix="${UPDATE_S3_PREFIX#/}"
          prefix="${prefix%/}"
          if [[ -z "$prefix" || ! "$prefix" =~ ^[A-Za-z0-9._/-]+$ || "$prefix" == *//* || "$prefix" == *'..'* ]]; then
            echo 'TV_UPDATE_S3_PREFIX must be a safe non-empty object prefix.' >&2
            exit 1
          fi

          update_apk_url=''
          update_release_id="tv-$version_name"
          autopublish='false'
          if [[ "$bootstrap_only" != 'true' && -n "${UPDATE_PUBLIC_BASE_URL:-}" ]]; then
            update_base="${UPDATE_PUBLIC_BASE_URL%/}"
            artifact_name="egi-tv-$version_name-code-$version_code"
            update_apk_url="$update_base/$prefix/$version_code/$artifact_name.apk"
          else
            artifact_name="egi-tv-$version_name-code-$version_code"
          fi

          if [[ "$AUTOPUBLISH_ENABLED" == 'true' && "$bootstrap_only" != 'true' ]]; then
            if [[ -z "${UPDATE_PUBLIC_BASE_URL:-}" ]]; then
              echo 'TV_UPDATE_PUBLIC_BASE_URL is required when automatic publishing is enabled.' >&2
              exit 1
            fi
            autopublish='true'
          fi

          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "previous_version_code=$previous_version_code"
            echo "artifact_name=$artifact_name"
            echo "update_apk_url=$update_apk_url"
            echo "update_release_id=$update_release_id"
            echo "autopublish=$autopublish"
            echo "object_prefix=$prefix"
            echo "commit_sha=$COMMIT_SHA"
          } >> "$GITHUB_OUTPUT"

          {
            echo '## EGI TV release build'
            echo
            echo "- Version: `$version_name` (code `$version_code`)"
            echo '- Package: `com.roomservice.tv`'
            echo '- Variant: `release`'
            echo "- Automatic update publication: `$autopublish`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare encrypted production signing key
        if: ${{ inputs.reuse_artifact_run_id == '' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TV_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo 'TV_SIGNING_KEYSTORE_BASE64 is missing from the tv-release environment.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/egi-tv-release.p12"
          chmod 600 "$RUNNER_TEMP/egi-tv-release.p12"
          echo "TV_SIGNING_STORE_FILE=$RUNNER_TEMP/egi-tv-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release with the repository release gate
        if: ${{ inputs.reuse_artifact_run_id == '' }}
        shell: bash
        env:
          API_BASE_URL: ${{ vars.TV_PRODUCTION_API_BASE_URL || 'https://api-production-505c.up.railway.app/api/v1/' }}
          TV_SIGNING_STORE_PASSWORD: ${{ secrets.TV_SIGNING_STORE_PASSWORD }}
          TV_SIGNING_KEY_ALIAS: ${{ secrets.TV_SIGNING_KEY_ALIAS }}
          TV_SIGNING_KEY_PASSWORD: ${{ secrets.TV_SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.resolve.outputs.version_code }}
          PREVIOUS_VERSION_CODE: ${{ steps.resolve.outputs.previous_version_code }}
          VERSION_NAME: ${{ steps.resolve.outputs.version_name }}
          UPDATE_APK_URL: ${{ steps.resolve.outputs.update_apk_url }}
          UPDATE_RELEASE_ID: ${{ steps.resolve.outputs.update_release_id }}
        run: |
          set -euo pipefail
          chmod +x apps/tv-shell/gradlew
          if [[ -n "${UPDATE_APK_URL:-}" ]]; then
            pwsh -NoLogo -NoProfile -NonInteractive -File ./tools/tv/package-tv.ps1 \
              -ApiBaseUrl "$API_BASE_URL" \
              -VersionCode "$VERSION_CODE" \
              -PreviousVersionCode "$PREVIOUS_VERSION_CODE" \
              -VersionName "$VERSION_NAME" \
              -UpdateApkUrl "$UPDATE_APK_URL" \
              -UpdateReleaseId "$UPDATE_RELEASE_ID"
          else
            pwsh -NoLogo -NoProfile -NonInteractive -File ./tools/tv/package-tv.ps1 \
              -ApiBaseUrl "$API_BASE_URL" \
              -VersionCode "$VERSION_CODE" \
              -PreviousVersionCode "$PREVIOUS_VERSION_CODE" \
              -VersionName "$VERSION_NAME"
          fi

      - name: Restore existing signed release artifact for recovery
        if: ${{ inputs.reuse_artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.resolve.outputs.artifact_name }}
          run-id: ${{ inputs.reuse_artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/egi-tv-release

      - name: Stage immutable release artifact
        id: stage
        shell: bash
        env:
          ARTIFACT_NAME: ${{ steps.resolve.outputs.artifact_name }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/egi-tv-release"
          mkdir -p "$output_dir"
          if [[ -z "${INPUT_REUSE_ARTIFACT_RUN_ID:-}" ]]; then
            source_dir='apps/tv-shell/app/build/outputs/apk/release'
            cp "$source_dir/app-release.apk" "$output_dir/$ARTIFACT_NAME.apk"
            cp "$source_dir/app-release.apk.sha256" "$output_dir/$ARTIFACT_NAME.apk.sha256"
            cp "$source_dir/app-release.apk.manifest.json" "$output_dir/$ARTIFACT_NAME.apk.manifest.json"
            if [[ -f "$source_dir/app-release.apk.tv-update-manifest.json" ]]; then
              cp "$source_dir/app-release.apk.tv-update-manifest.json" "$output_dir/$ARTIFACT_NAME.tv-update-manifest.json"
            fi
          fi

          actual_sha256="$(sha256sum "$output_dir/$ARTIFACT_NAME.apk" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
          manifest_sha256="$(jq -r '.sha256' "$output_dir/$ARTIFACT_NAME.apk.manifest.json" | tr '[:lower:]' '[:upper:]')"
          if [[ "$actual_sha256" != "$manifest_sha256" ]]; then
            echo 'Staged APK checksum does not match its release manifest.' >&2
            exit 1
          fi
          if [[ ! -s "$output_dir/$ARTIFACT_NAME.apk" ]]; then
            echo 'Staged APK is empty.' >&2
            exit 1
          fi
          if ! command -v apkanalyzer >/dev/null 2>&1; then
            echo 'apkanalyzer is required to verify the release APK identity.' >&2
            exit 1
          fi
          test "$(apkanalyzer manifest application-id "$output_dir/$ARTIFACT_NAME.apk")" = 'com.roomservice.tv'
          test "$(apkanalyzer manifest debuggable "$output_dir/$ARTIFACT_NAME.apk")" = 'false'
          test "$(apkanalyzer manifest version-code "$output_dir/$ARTIFACT_NAME.apk")" = "${{ steps.resolve.outputs.version_code }}"
          jq -n \
            --arg commitSha "${{ github.sha }}" \
            --arg releaseId "${{ steps.resolve.outputs.update_release_id }}" \
            --arg versionName "${{ steps.resolve.outputs.version_name }}" \
            --arg versionCode "${{ steps.resolve.outputs.version_code }}" \
            --arg packageName 'com.roomservice.tv' \
            --arg certificateSha256 "$(jq -r '.certificateSha256' "$output_dir/$ARTIFACT_NAME.apk.manifest.json")" \
            --arg sha256 "$actual_sha256" \
            '{commitSha:$commitSha,releaseId:$releaseId,versionName:$versionName,versionCode:($versionCode|tonumber),packageName:$packageName,certificateSha256:$certificateSha256,sha256:$sha256}' \
            > "$output_dir/release-record.json"
          echo "staged_directory=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve.outputs.artifact_name }}
          path: ${{ steps.stage.outputs.staged_directory }}
          if-no-files-found: error
          retention-days: 90

  publish-update:
    name: Publish immutable APK through the private storage bridge
    needs: build-release
    if: ${{ needs.build-release.outputs.autopublish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: tv-update-publish

    env:
      ARTIFACT_NAME: ${{ needs.build-release.outputs.artifact_name }}
      VERSION_CODE: ${{ needs.build-release.outputs.version_code }}
      UPDATE_APK_URL: ${{ needs.build-release.outputs.update_apk_url }}
      API_BASE_URL: ${{ vars.TV_PRODUCTION_API_BASE_URL || 'https://api-production-505c.up.railway.app/api/v1/' }}
      UPDATE_PUBLIC_BASE_URL: ${{ vars.TV_UPDATE_PUBLIC_BASE_URL || '' }}
      UPDATE_PREFIX: ${{ needs.build-release.outputs.object_prefix }}
      UPDATE_UPLOAD_TOKEN: ${{ secrets.TV_UPDATE_UPLOAD_TOKEN }}

    steps:
      - name: Download signed release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-release.outputs.artifact_name }}
          path: ${{ runner.temp }}/egi-tv-release

      - name: Validate storage configuration and artifact identity
        shell: bash
        run: |
          set -euo pipefail
          : "${API_BASE_URL:?TV_PRODUCTION_API_BASE_URL is required}"
          : "${UPDATE_PUBLIC_BASE_URL:?TV_UPDATE_PUBLIC_BASE_URL is required}"
          : "${UPDATE_UPLOAD_TOKEN:?TV_UPDATE_UPLOAD_TOKEN is required}"
          apk="$RUNNER_TEMP/egi-tv-release/$ARTIFACT_NAME.apk"
          update_manifest="$RUNNER_TEMP/egi-tv-release/$ARTIFACT_NAME.tv-update-manifest.json"
          test -f "$apk"
          test -f "$update_manifest"
          test "$(jq -r '.enabled' "$update_manifest")" = 'true'
          test "$(jq -r '.packageName' "$update_manifest")" = 'com.roomservice.tv'
          test "$(jq -r '.latestVersionCode' "$update_manifest")" = "$VERSION_CODE"
          test "$(jq -r '.apkUrl' "$update_manifest")" = "$UPDATE_APK_URL"
          test "$UPDATE_APK_URL" = "${UPDATE_PUBLIC_BASE_URL%/}/$UPDATE_PREFIX/$VERSION_CODE/$ARTIFACT_NAME.apk"
          echo "APK_URL=$UPDATE_APK_URL" >> "$GITHUB_ENV"

      - name: Upload immutable versioned APK and manifests
        shell: bash
        run: |
          set -euo pipefail
          prefix="${UPDATE_PREFIX#/}"
          prefix="${prefix%/}"
          apk="$RUNNER_TEMP/egi-tv-release/$ARTIFACT_NAME.apk"
          checksum="$RUNNER_TEMP/egi-tv-release/$ARTIFACT_NAME.apk.sha256"
          release_manifest="$RUNNER_TEMP/egi-tv-release/$ARTIFACT_NAME.apk.manifest.json"
          update_manifest="$RUNNER_TEMP/egi-tv-release/$ARTIFACT_NAME.tv-update-manifest.json"

          object_matches() {
            local key="$1"
            local file="$2"
            local remote_file="$RUNNER_TEMP/egi-tv-remote-object"
            local status
            status="$(curl --silent --show-error --location --max-time 180 \
              --output "$remote_file" --write-out '%{http_code}' \
              "${UPDATE_PUBLIC_BASE_URL%/}/$key")"
            if [[ "$status" != '200' ]]; then
              return 1
            fi
            remote_hash="$(sha256sum "$remote_file" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
            local_hash="$(sha256sum "$file" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
            [[ "$remote_hash" == "$local_hash" ]]
          }

          put_immutable() {
            local key="$1"
            local file="$2"
            local content_type="$3"
            local object_url="${UPDATE_PUBLIC_BASE_URL%/}/$key"
            local upload_url="${API_BASE_URL%/}/tv/update-artifact/$key"
            local remote_file="$RUNNER_TEMP/egi-tv-existing-object"
            local status
            status="$(curl --silent --show-error --location --max-time 180 \
              --output "$remote_file" --write-out '%{http_code}' "$object_url")"
            if [[ "$status" == '200' ]]; then
              if object_matches "$key" "$file"; then
                echo "Immutable object already exists with the same checksum: $key"
                return 0
              fi
              echo "Immutable object exists with a different checksum: $key" >&2
              exit 1
            fi
            if [[ "$status" != '404' ]]; then
              echo "Unable to inspect immutable object $key (HTTP $status)." >&2
              exit 1
            fi
            curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 300 \
              --request POST --upload-file "$file" \
              --header "Authorization: Bearer $UPDATE_UPLOAD_TOKEN" \
              --header "Content-Type: $content_type" \
              "$upload_url"
            if ! object_matches "$key" "$file"; then
              echo "Uploaded object checksum verification failed: $key" >&2
              exit 1
            fi
          }

          put_immutable "$prefix/$VERSION_CODE/$ARTIFACT_NAME.apk" "$apk" 'application/vnd.android.package-archive'
          put_immutable "$prefix/$VERSION_CODE/$ARTIFACT_NAME.apk.sha256" "$checksum" 'text/plain'
          # Send JSON manifests as octet-stream so Nest's JSON parser does not
          # consume the raw request body before the CI-only upload endpoint.
          # The API infers and stores the canonical application/json type from
          # the immutable file name.
          put_immutable "$prefix/$VERSION_CODE/$ARTIFACT_NAME.apk.manifest.json" "$release_manifest" 'application/octet-stream'
          put_immutable "$prefix/$VERSION_CODE/update-manifest.json" "$update_manifest" 'application/octet-stream'

          # The versioned APK and release manifests are immutable. The latest
          # pointer is intentionally mutable: every approved release moves it
          # to the newest verified manifest. It is still verified byte-for-byte
          # after the overwrite and never affects the immutable APK URL.
          put_latest() {
            local key="$1"
            local file="$2"
            local content_type="$3"
            local upload_url="${API_BASE_URL%/}/tv/update-artifact/$key"
            curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 300 \
              --request POST --upload-file "$file" \
              --header "Authorization: Bearer $UPDATE_UPLOAD_TOKEN" \
              --header "Content-Type: $content_type" \
              "$upload_url"
            if ! object_matches "$key" "$file"; then
              echo "Latest manifest checksum verification failed: $key" >&2
              exit 1
            fi
          }

          put_latest "$prefix/latest/latest.json" "$update_manifest" 'application/octet-stream'

      - name: Verify public immutable URL without following redirects
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/egi-tv-update-headers.txt"
          curl --fail --silent --show-error --max-time 30 --max-redirs 0 \
            --range 0-0 --dump-header "$headers" --output /dev/null "$APK_URL"
          status="$(awk 'NR == 1 { print $2 }' "$headers")"
          if [[ "$status" != '200' && "$status" != '206' ]]; then
            echo "Public APK URL returned unexpected HTTP status $status." >&2
            exit 1
          fi

      - name: Publish summary
        shell: bash
        run: |
          {
            echo '## EGI TV update published'
            echo
            echo "- Version code: `$VERSION_CODE`"
            echo "- APK URL: `$APK_URL`"
            echo '- Redirect policy: no redirects accepted'
          } >> "$GITHUB_STEP_SUMMARY"

  promote-api-update-feed:
    name: Promote update feed on Railway
    needs: [build-release, publish-update]
    if: ${{ needs.build-release.outputs.autopublish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: tv-production-update

    env:
      ARTIFACT_NAME: ${{ needs.build-release.outputs.artifact_name }}
      API_BASE_URL: ${{ vars.TV_PRODUCTION_API_BASE_URL || 'https://api-production-505c.up.railway.app/api/v1/' }}
      STAFF_WEB_URL: ${{ vars.TV_STAFF_WEB_URL }}
      GUEST_WEB_URL: ${{ vars.TV_GUEST_WEB_URL }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_API_SERVICE: ${{ vars.RAILWAY_API_SERVICE }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Checkout release verification tools
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Download signed release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-release.outputs.artifact_name }}
          path: ${{ runner.temp }}/egi-tv-release

      - name: Promote exact verified manifest
        shell: bash
        run: |
          set -euo pipefail
          : "${RAILWAY_TOKEN:?RAILWAY_TOKEN is required in the tv-production-update environment}"
          : "${RAILWAY_API_SERVICE:?RAILWAY_API_SERVICE is required as an environment variable}"
          : "${RAILWAY_PROJECT_ID:?RAILWAY_PROJECT_ID is required as an environment variable}"
          manifest="$RUNNER_TEMP/egi-tv-release/$ARTIFACT_NAME.tv-update-manifest.json"
          test -f "$manifest"

          package_name="$(jq -r '.packageName' "$manifest")"
          version_code="$(jq -r '.latestVersionCode' "$manifest")"
          version_name="$(jq -r '.latestVersionName' "$manifest")"
          apk_url="$(jq -r '.apkUrl' "$manifest")"
          sha256="$(jq -r '.sha256' "$manifest")"
          certificate_sha256="$(jq -r '.certificateSha256' "$manifest")"
          release_id="$(jq -r '.releaseId' "$manifest")"
          mandatory="$(jq -r '.mandatory' "$manifest")"
          minimum_version_code="$(jq -r '.minSupportedVersionCode' "$manifest")"

          test "$package_name" = 'com.roomservice.tv'
          test "$certificate_sha256" = '50dff6906e42e0ea5ee933225fadf4a55cb9a2050baaeafa3bff8b6d90820904'
          test "$apk_url" != 'null'
          test "$sha256" != 'null'

          railway variable set \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_API_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --skip-deploys \
            "TV_UPDATE_ENABLED=true" \
            "TV_UPDATE_VERSION_CODE=$version_code" \
            "TV_UPDATE_VERSION_NAME=$version_name" \
            "TV_UPDATE_APK_URL=$apk_url" \
            "TV_UPDATE_SHA256=$sha256" \
            "TV_UPDATE_CERTIFICATE_SHA256=$certificate_sha256" \
            "TV_UPDATE_RELEASE_ID=$release_id" \
            "TV_UPDATE_MANDATORY=$mandatory" \
            "TV_UPDATE_MIN_SUPPORTED_VERSION_CODE=$minimum_version_code"

          railway service redeploy \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_API_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --yes

      - name: Verify Railway and same-origin production surfaces
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ needs.build-release.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ needs.build-release.outputs.version_name }}
          EXPECTED_RELEASE_ID: ${{ needs.build-release.outputs.release_id }}
          EXPECTED_APK_URL: ${{ needs.build-release.outputs.update_apk_url }}
        run: |
          set -euo pipefail
          : "${STAFF_WEB_URL:?TV_STAFF_WEB_URL is required in the tv-production-update environment}"
          : "${GUEST_WEB_URL:?TV_GUEST_WEB_URL is required in the tv-production-update environment}"
          manifest="$RUNNER_TEMP/egi-tv-release/$ARTIFACT_NAME.tv-update-manifest.json"
          expected_sha256="$(jq -r '.sha256' "$manifest")"
          expected_certificate="$(jq -r '.certificateSha256' "$manifest")"
          for attempt in $(seq 1 18); do
            if node tools/verify-tv-release.mjs \
              --environment production \
              --api-url "$API_BASE_URL" \
              --staff-url "$STAFF_WEB_URL" \
              --guest-url "$GUEST_WEB_URL" \
              --version-code "$EXPECTED_VERSION_CODE" \
              --version-name "$EXPECTED_VERSION_NAME" \
              --release-id "$EXPECTED_RELEASE_ID" \
              --apk-url "$EXPECTED_APK_URL" \
              --sha256 "$expected_sha256" \
              --certificate "$expected_certificate"; then
              exit 0
            fi
            sleep 10
          done
          echo 'Production release verification did not pass within the deployment window.' >&2
          exit 1

      - name: Promotion summary
        run: |
          {
            echo '## EGI TV update feed promoted'
            echo
            echo "- Railway environment: `$RAILWAY_ENVIRONMENT`"
            echo "- Release ID: `${{ needs.build-release.outputs.release_id }}`"
            echo "- Commit: `${{ needs.build-release.outputs.commit_sha }}`"
            echo "- APK URL: `${{ needs.build-release.outputs.update_apk_url }}`"
            echo '- API, Staff Web, Guest Web, Socket.IO proxy, and APK artifact verified'
          } >> "$GITHUB_STEP_SUMMARY"
