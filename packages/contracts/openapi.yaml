openapi: 3.0.3
info:
  title: Room Service Hadith API
  version: 0.1.0
  description: |
    OpenAPI contract for the Hotel Guest Service Platform MVP.

    The API supports guest requests from a room-bound QR code or Smart TV,
    operational department dashboards, Room Manager monitoring, and
    Receptionist guest-room assignment. Staff authentication/RBAC, Smart TV
    provisioning, Guest context/catalog/request APIs, and their memory and
    PostgreSQL repository adapters are implemented in apps/api. Guest screens
    and later operational domains remain incremental implementation work.
servers:
  - url: http://127.0.0.1:3000/api/v1
    description: Local development
tags:
  - name: Health
    description: Unauthenticated process liveness check for hosted environments.
  - name: Authentication
    description: Staff session lifecycle and current user information.
  - name: Guest Context
    description: Room-bound context used by QR/mobile and Smart TV clients.
  - name: Guest Catalog
    description: Active departments and menu items visible to a guest.
  - name: Guest Requests
    description: Guest request creation and status tracking.
  - name: TV
    description: Smart TV device context and personalized welcome state.
  - name: Department Requests
    description: Department-scoped operational request queue and actions.
  - name: Room Manager
    description: Read-only monitoring for SPA, Restaurant, Lounge, and Housekeeping.
  - name: Receptionist
    description: Manual guest-to-room assignment and checkout flow.
  - name: Menu Management
    description: |
      Flat menu/service catalog management for the staff member's own unit,
      subject to menu:manage permission. Restaurant, Lounge, Cafe, SPA, and
      Beauty & Salon are CMS-enabled; categories are not part of the contract.
  - name: Staff Management
    description: Superadmin-only staff user and role administration.
x-realtime:
  transport: Socket.IO
  namespace: /realtime
  authentication:
    header: X-Device-Credential
    description: Native TV clients send the same mapped device credential used by REST.
  companionContract: packages/contracts/realtime-events.md
  events:
    - guest.assignment.updated
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check API process health
      security: []
      responses:
        '200':
          description: API process is accepting requests.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    example: room-service-api
        '400':
          description: Request is malformed.

  /auth/staff/login:
    post:
      tags: [Authentication]
      operationId: loginStaff
      summary: Start a staff session
      description: Authenticates a staff user and sets a Secure, HttpOnly session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
            examples:
              default:
                value:
                  email: receptionist@hadith-hotel.com
                  password: password
      responses:
        '200':
          description: Staff session created.
          headers:
            Set-Cookie:
              description: Session cookie. The concrete cookie attributes are enforced by the server.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/staff/logout:
    post:
      tags: [Authentication]
      operationId: logoutStaff
      summary: End the current staff session
      security:
        - StaffSession: []
      responses:
        '204':
          description: Session ended and cookie invalidated.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentStaffUser
      summary: Get the authenticated staff user
      security:
        - StaffSession: []
      responses:
        '200':
          description: Current staff identity, roles, and permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /guest/context:
    get:
      tags: [Guest Context]
      operationId: getGuestContext
      summary: Resolve the current room-bound guest context
      description: |
        Resolves a room from either the opaque token extracted from a QR URL
        or the mapped Smart TV device credential. The client does not submit a
        room number.
      security:
        - GuestAccessToken: []
        - TvDeviceCredential: []
      responses:
        '200':
          description: Room-bound guest context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestContext'
        '401':
          $ref: '#/components/responses/GuestContextUnauthorized'
        '404':
          $ref: '#/components/responses/ContextNotFound'

  /guest/departments:
    get:
      tags: [Guest Catalog]
      operationId: listGuestDepartments
      summary: List guest-visible departments and units
      security:
        - GuestAccessToken: []
        - TvDeviceCredential: []
      responses:
        '200':
          description: Departments and units available to the guest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentListResponse'
        '401':
          $ref: '#/components/responses/GuestContextUnauthorized'
        '404':
          $ref: '#/components/responses/ContextNotFound'

  /guest/menus:
    get:
      tags: [Guest Catalog]
      operationId: listGuestMenus
      summary: List active menu items and services
      description: Menu routing is derived from the selected item; the client does not choose a dashboard destination.
      security:
        - GuestAccessToken: []
        - TvDeviceCredential: []
      parameters:
        - $ref: '#/components/parameters/GuestUnitFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Active menu items for the requested unit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemListResponse'
        '401':
          $ref: '#/components/responses/GuestContextUnauthorized'
        '404':
          $ref: '#/components/responses/ContextNotFound'

  /guest/menus/{menuItemId}:
    get:
      tags: [Guest Catalog]
      operationId: getGuestMenuItem
      summary: Get one active menu item or service
      security:
        - GuestAccessToken: []
        - TvDeviceCredential: []
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      responses:
        '200':
          description: Active menu item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '401':
          $ref: '#/components/responses/GuestContextUnauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /guest/requests:
    get:
      tags: [Guest Requests]
      operationId: listGuestRequests
      summary: List requests for the current room context
      description: 'Returns requests belonging only to the active guest assignment in the room-bound context.'
      security:
        - GuestAccessToken: []
        - TvDeviceCredential: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/RequestStatusFilter'
      responses:
        '200':
          description: Requests belonging to the current room context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestRequestListResponse'
        '401':
          $ref: '#/components/responses/GuestContextUnauthorized'
        '404':
          $ref: '#/components/responses/ContextNotFound'
    post:
      tags: [Guest Requests]
      operationId: createGuestRequest
      summary: Submit a request or order
      description: |
        Creates a NEW request. All submitted menu items must resolve to the
        same unit so that backend routing is unambiguous. The room is derived
        from the QR or TV context, never from the request body.
      security:
        - GuestAccessToken: []
        - TvDeviceCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuestRequest'
            examples:
              restaurant:
                value:
                  clientRequestId: 2d8f0b6e-1f7b-4c27-91c5-93d6f8b9c8c0
                  items:
                    - menuItemId: 2cbbf8a2-fb66-4ae4-8b95-d3b37c2a7b10
                      quantity: 1
                      note: No spicy sauce
      responses:
        '201':
          description: Request created with status NEW.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/GuestContextUnauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/RequestConflict'

  /guest/requests/{requestId}:
    get:
      tags: [Guest Requests]
      operationId: getGuestRequest
      summary: Get one room-bound request and its status history
      security:
        - GuestAccessToken: []
        - TvDeviceCredential: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request status and timestamps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestRequest'
        '401':
          $ref: '#/components/responses/GuestContextUnauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /tv/context:
    get:
      tags: [TV]
      operationId: getTvContext
      summary: Get Smart TV room and welcome state
      description: Returns the room mapped to the TV device and the current personalized welcome state.
      security:
        - TvDeviceCredential: []
      responses:
        '200':
          description: Smart TV context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvContext'
        '401':
          $ref: '#/components/responses/DeviceUnauthorized'
        '404':
          $ref: '#/components/responses/ContextNotFound'

  /tv/provisioning/start:
    post:
      tags: [TV]
      operationId: startTvProvisioning
      summary: Start one-time TV pairing
      description: Creates a short-lived pairing code for a newly installed TV. No room number or device credential is accepted from the TV.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTvProvisioningRequest'
      responses:
        '200':
          description: Pairing code created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartTvProvisioningResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /tv/provisioning/claim:
    post:
      tags: [TV]
      operationId: claimTvProvisioning
      summary: Claim a paired TV credential
      description: Exchanges a pairing code after receptionist confirmation for the mapped TV credential.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimTvProvisioningRequest'
      responses:
        '200':
          description: TV credential issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimTvProvisioningResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '410':
          $ref: '#/components/responses/PairingExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /receptionist/tv-devices:
    get:
      tags: [Receptionist]
      operationId: listTvDevices
      summary: List TV devices managed by the receptionist
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: roomId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TvProvisioningStatus'
      responses:
        '200':
          description: TV devices without credentials or pairing secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvDeviceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /receptionist/tv-devices/pair:
    post:
      tags: [Receptionist]
      operationId: pairTvDevice
      summary: Map a pending TV to a room
      description: Receptionist-only operation that binds a short-lived TV pairing code to a room.
      security:
        - StaffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairTvDeviceRequest'
      responses:
        '200':
          description: TV device mapped to the room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairTvDeviceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '410':
          $ref: '#/components/responses/PairingExpired'

  /receptionist/tv-devices/{deviceId}/revoke:
    post:
      tags: [Receptionist]
      operationId: revokeTvDevice
      summary: Revoke a TV device credential
      security:
        - StaffSession: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: TV device revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /receptionist/tv-devices/{deviceId}/reset:
    post:
      tags: [Receptionist]
      operationId: resetTvDevice
      summary: Reset a TV device for re-pairing
      description: Revokes the current credential, clears the room mapping, and starts a fresh short-lived pairing session for the same TV installation.
      security:
        - StaffSession: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: TV device reset and ready to pair again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetTvDeviceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /department/requests:
    get:
      tags: [Department Requests]
      operationId: listDepartmentRequests
      summary: List requests visible to the authenticated department
      description: |
        The server scopes results by the staff user's department role. Food &
        Beverages may filter between Restaurant and Lounge; other departments
        can only see their own unit.
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/RequestStatusFilter'
        - $ref: '#/components/parameters/RoomFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/UnitFilter'
      responses:
        '200':
          description: Department-scoped operational queue or history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffRequestListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /department/requests/{requestId}:
    get:
      tags: [Department Requests]
      operationId: getDepartmentRequest
      summary: Get one department-scoped request
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Department request detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /department/requests/{requestId}/confirm:
    post:
      tags: [Department Requests]
      operationId: confirmDepartmentRequest
      summary: Confirm a NEW request
      description: Only the department that owns the request may transition NEW to IN_PROCESS. Confirmed time is recorded by the server.
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request confirmed and now IN_PROCESS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/InvalidStatusTransition'

  /department/requests/{requestId}/done:
    post:
      tags: [Department Requests]
      operationId: completeDepartmentRequest
      summary: Mark an IN_PROCESS request as done
      description: Only the department that owns the request may transition IN_PROCESS to COMPLETED. Done time is recorded by the server.
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/InvalidStatusTransition'

  /room-manager/requests:
    get:
      tags: [Room Manager]
      operationId: listRoomManagerRequests
      summary: List monitored request activity
      description: |
        Read-only monitoring limited to SPA, Restaurant, Lounge, and
        Housekeeping. Beauty & Salon and Cafe are intentionally excluded.
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/RequestStatusFilter'
        - $ref: '#/components/parameters/RoomFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/MonitoredUnitFilter'
      responses:
        '200':
          description: Monitored request activity and timestamps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomManagerRequestListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /room-manager/requests/{requestId}:
    get:
      tags: [Room Manager]
      operationId: getRoomManagerRequest
      summary: Get one monitored request
      description: Room Manager access is read-only and limited to monitored units.
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Monitored request detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomManagerRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /receptionist/rooms:
    get:
      tags: [Receptionist]
      operationId: listReceptionistRooms
      summary: List rooms and active guest assignments
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/RoomStatusFilter'
        - $ref: '#/components/parameters/RoomSearch'
      responses:
        '200':
          description: Room list for Receptionist dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionistRoomListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /receptionist/rooms/{roomId}:
    get:
      tags: [Receptionist]
      operationId: getReceptionistRoom
      summary: Get one room and its active guest assignment
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Room detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionistRoom'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /receptionist/rooms/{roomId}/guest-assignment:
    post:
      tags: [Receptionist]
      operationId: assignGuestToRoom
      summary: Assign a guest to a vacant room
      description: Creates an ACTIVE assignment and changes the application room status to OCCUPIED.
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignGuestRequest'
      responses:
        '201':
          description: Guest assigned to the room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/RoomAssignmentConflict'

  /receptionist/guest-assignments/{assignmentId}:
    patch:
      tags: [Receptionist]
      operationId: updateGuestAssignment
      summary: Edit the active guest name
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGuestAssignmentRequest'
      responses:
        '200':
          description: Guest assignment updated; the TV welcome state is refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/AssignmentConflict'

  /receptionist/guest-assignments/{assignmentId}/checkout:
    post:
      tags: [Receptionist]
      operationId: checkoutGuestAssignment
      summary: End an active guest assignment
      description: Ends the assignment, changes the application room status to VACANT, and clears the personalized TV welcome state.
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: Assignment checked out; room is VACANT and the personalized welcome is cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/AssignmentConflict'

  /receptionist/rooms/{roomId}/guest-access-token:
    get:
      tags: [Receptionist]
      operationId: getGuestAccessTokenStatus
      summary: Get the room QR access status
      description: Returns QR metadata only. The opaque token is never returned by this endpoint.
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Current QR status for the room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestQrRoomStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    post:
      tags: [Receptionist]
      operationId: issueGuestAccessToken
      summary: Issue the room QR access URL
      description: |
        Creates or rotates the one opaque QR token for a room. The token is
        returned only inside the QR URL; it is valid only while the room has
        an active guest assignment.
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: QR URL generated for the room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestAccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /receptionist/rooms/{roomId}/guest-access-token/revoke:
    post:
      tags: [Receptionist]
      operationId: revokeGuestAccessToken
      summary: Revoke the room QR access token
      description: Revokes the active QR token for the room. Revocation is recoverable by issuing a new token.
      security:
        - StaffSession: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Current room QR token revocation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeGuestAccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /receptionist/guest-access-tokens/batch:
    post:
      tags: [Receptionist]
      operationId: issueGuestAccessTokensBatch
      summary: Issue room QR access URLs in one transaction
      description: Rotates one opaque QR token for each requested room. The operation is atomic.
      security:
        - StaffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGuestAccessTokenRequest'
      responses:
        '200':
          description: QR URLs generated for all requested rooms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGuestAccessTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

