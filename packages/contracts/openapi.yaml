        '409':
          $ref: '#/components/responses/ResourceConflict'

components:
  securitySchemes:
    StaffSession:
      type: apiKey
      in: cookie
      name: room_service_session
      description: Secure HttpOnly staff session cookie. Staff users do not use a bearer token in this MVP.
    GuestAccessToken:
      type: apiKey
      in: header
      name: X-Guest-Access-Token
      description: Opaque token extracted from the room QR URL. It is not a room number and is scoped to a room context.
    TvDeviceCredential:
      type: apiKey
      in: header
      name: X-Device-Credential
      description: Credential for the Smart TV device mapped to a room.
  parameters:
    Page:
      name: page
      in: query
      description: One-based page number.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Number of records per page.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    RequestStatusFilter:
      name: status
      in: query
      description: Filter by operational request status.
      required: false
      schema:
        $ref: '#/components/schemas/RequestStatus'
    RoomFilter:
      name: room
      in: query
      description: Filter by room number.
      required: false
      schema:
        type: string
        maxLength: 20
    DateFrom:
      name: dateFrom
      in: query
      description: Inclusive request date in ISO 8601 date format.
      required: false
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      description: Inclusive request date in ISO 8601 date format.
      required: false
      schema:
        type: string
        format: date
    UnitFilter:
      name: unit
      in: query
      description: Filter by department unit. Server-side RBAC still limits the result.
      required: false
      schema:
        $ref: '#/components/schemas/UnitCode'
    GuestUnitFilter:
      name: unit
      in: query
      description: Guest menu unit to load. Lounge is returned by departments but is disabled until configured.
      required: true
      schema:
        $ref: '#/components/schemas/UnitCode'
    MonitoredUnitFilter:
      name: unit
      in: query
      description: Room Manager filter limited to monitored units.
      required: false
      schema:
        $ref: '#/components/schemas/MonitoredUnitCode'
    IncludeInactive:
      name: includeInactive
      in: query
      description: Include deactivated menu items.
      required: false
      schema:
        type: boolean
        default: false
    RoomStatusFilter:
      name: status
      in: query
      description: Filter by application room status.
      required: false
      schema:
        $ref: '#/components/schemas/RoomStatus'
    RoomSearch:
      name: search
      in: query
      description: Search by room number or active guest name.
      required: false
      schema:
        type: string
        maxLength: 100
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MenuItemId:
      name: menuItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffRoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        description: System role code or custom role identifier.
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Staff session is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    GuestContextUnauthorized:
      description: Guest access token or TV device credential is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DeviceUnauthorized:
      description: Smart TV device credential is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidCredentials:
      description: Staff credentials are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: The authenticated role or permission cannot access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ResourceNotFound:
      description: The requested resource does not exist or is outside the caller's scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ContextNotFound:
      description: The QR token or device is not mapped to a valid room context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RequestConflict:
      description: Duplicate client request ID, unavailable menu item, or cross-unit request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidStatusTransition:
      description: The requested status transition is not valid for the current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RoomAssignmentConflict:
      description: The room is already occupied or cannot accept a new assignment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AssignmentConflict:
      description: The guest assignment is not active or cannot be changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ResourceConflict:
      description: The requested resource change conflicts with existing data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Too many authentication attempts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PairingExpired:
      description: The one-time TV pairing code has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required: [statusCode, code, message, timestamp]
      properties:
        statusCode:
          type: integer
          example: 409
        code:
          description: Stable machine-readable error code.
          example: INVALID_STATUS_TRANSITION
        message:
          type: string
          example: Request cannot be completed from its current status.
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
        requestId:
          type: string
          description: Correlation ID for support and audit logs.
          example: 0d4f2e0b-2f37-4f90-9cf7-96b13e4e4ca7
        timestamp:
          type: string
          format: date-time
          example: 2026-08-29T14:08:00Z
    ValidationErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: items[0].quantity
        message:
          type: string
          example: Quantity must be at least 1.
    RoleCode:
      type: string
      enum:
        - SUPERADMIN
        - ROOM_MANAGER
        - RECEPTIONIST
        - SPA
        - RESTAURANT
        - LOUNGE
        - HOUSEKEEPING
        - BEAUTY_AND_SALON
        - CAFE
    DepartmentCode:
      type: string
      enum:
        - SPA
        - FOOD_AND_BEVERAGES
        - HOUSEKEEPING
        - BEAUTY_AND_SALON
        - CAFE
    UnitCode:
      type: string
      enum:
        - SPA
        - RESTAURANT
        - LOUNGE
        - HOUSEKEEPING
        - BEAUTY_AND_SALON
        - CAFE
    MonitoredUnitCode:
      type: string
      enum: [SPA, RESTAURANT, LOUNGE, HOUSEKEEPING]
    RequestStatus:
      type: string
      enum: [NEW, IN_PROCESS, COMPLETED]
    RoomStatus:
      type: string
      enum: [VACANT, OCCUPIED]
    AssignmentStatus:
      type: string
      enum: [ACTIVE, CHECKED_OUT]
    MenuItemKind:
      type: string
      enum: [PRODUCT, SERVICE]
    LocalizedText:
      type: object
      required: [uz, ru, en]
      properties:
        uz:
          type: string
          minLength: 1
          maxLength: 200
        ru:
          type: string
          minLength: 1
          maxLength: 200
        en:
          type: string
          minLength: 1
          maxLength: 200
    LocalizedDescription:
      type: object
      required: [uz, ru, en]
      properties:
        uz:
          type: string
          minLength: 1
          maxLength: 2000
        ru:
          type: string
          minLength: 1
          maxLength: 2000
        en:
          type: string
          minLength: 1
          maxLength: 2000
    StaffLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
          description: Staff email address used for authentication.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 200
    StaffSessionResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/StaffUser'
        expiresAt:
          type: string
          format: date-time
    StaffUser:
      type: object
      required: [id, displayName, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: Siti Receptionist
        roles:
          type: array
          items:
            type: string
          description: System role codes or custom role codes assigned to the user.
        permissions:
          type: array
          items:
            type: string
          example: [request:view, request:confirm, request:complete]
    StaffManagementUser:
      type: object
      required: [id, email, displayName, roles, active, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          minItems: 1
          items:
            type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StaffManagementUserListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffManagementUser'
    CreateStaffUserRequest:
      type: object
      required: [email, displayName, roles, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 200
        active:
          type: boolean
          default: true
    UpdateStaffUserRequest:
      type: object
      minProperties: 1
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        roles:
